<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Triple Pendulum</title>
  <style>
    :root {
      --bob1: #b44fff;
      --bob2: #ffd700;
      --bob3: #00e5cc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(ellipse at center, #1a4a6b 0%, #060a14 100%);
      color: #d0d0e8;
      font-family: 'Courier New', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── SHARED BUTTON STYLE ── */
    button {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      color: #d0d0e8;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover  { background: rgba(255,255,255,0.07); }
    button:active { background: rgba(255,255,255,0.15); }
    button.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35); }

    /* ── CANVAS ── */
    canvas { flex: 1; display: block; touch-action: none; }

    /* ════════════════════════════════════════════
       DESKTOP CONTROLS  (>= 700px)
       Full bar across the top with all sliders
    ════════════════════════════════════════════ */
    #desktop-controls {
      display: none; /* hidden on mobile, shown on desktop below */
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      padding: 8px 16px;
      background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .ctrl label { color: #b0b8d0; white-space: nowrap; }
    .ctrl input[type="range"] { width: 80px; accent-color: #7c6fff; }
    .ctrl span { font-size: 12px; font-weight: bold; min-width: 38px; color: #d0d0e8; }

    .divider {
      width: 1px; height: 22px;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

    /* ════════════════════════════════════════════
       MOBILE CONTROLS  (< 700px)
       Slim top bar with buttons + gear drawer
    ════════════════════════════════════════════ */
    #mobile-topbar {
      display: flex; /* shown on mobile, hidden on desktop below */
      gap: 8px;
      align-items: center;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #mobile-topbar button { font-size: 13px; padding: 7px 14px; min-height: 36px; }

    #drawerToggle {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      right: 18px;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #d0d0e8;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: background 0.15s;
    }
    #drawerToggle:active { background: rgba(255,255,255,0.22); }

    #drawer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a24;
      border-top: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px 16px 0 0;
      padding: 16px 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 10;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 70dvh;
      overflow-y: auto;
    }
    #drawer.open { transform: translateY(0); }

    #drawerHandle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .section-title {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      margin: 14px 0 8px;
    }
    .section-title:first-child { margin-top: 0; }

    .slider-row {
      display: grid;
      grid-template-columns: 90px 1fr 48px;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .slider-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; color: #b0b8d0; white-space: nowrap;
    }
    .slider-val { font-size: 12px; font-weight: bold; color: #d0d0e8; text-align: right; }

    #hint {
      position: fixed;
      bottom: 76px; left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    #hint.hidden { opacity: 0; }

    /* ════════════════════════════════════════════
       RESPONSIVE SWITCH
       >= 700px  →  desktop bar visible, mobile hidden
       <  700px  →  mobile bar visible, desktop hidden
    ════════════════════════════════════════════ */
    @media (min-width: 700px) {
      #desktop-controls { display: flex; }
      #mobile-topbar    { display: none; }
      #drawerToggle     { display: none; }
      #drawer           { display: none; }
      #hint             { display: none; }
    }
  </style>
</head>
<body>

<!-- ── DESKTOP: full control bar ── -->
<div id="desktop-controls">
  <div class="ctrl">
    <span class="dot" style="background:var(--bob1)"></span>
    <label>Arm 1</label>
    <input type="range" id="dl1" min="40" max="180" value="110" step="1">
    <span id="dl1v">110</span>
  </div>
  <div class="ctrl">
    <span class="dot" style="background:var(--bob2)"></span>
    <label>Arm 2</label>
    <input type="range" id="dl2" min="40" max="180" value="100" step="1">
    <span id="dl2v">100</span>
  </div>
  <div class="ctrl">
    <span class="dot" style="background:var(--bob3)"></span>
    <label>Arm 3</label>
    <input type="range" id="dl3" min="40" max="180" value="90" step="1">
    <span id="dl3v">90</span>
  </div>

  <div class="divider"></div>

  <div class="ctrl">
    <label>Mass 1</label>
    <input type="range" id="dm1" min="0.5" max="4" value="1.5" step="0.1">
    <span id="dm1v">1.5</span>
  </div>
  <div class="ctrl">
    <label>Mass 2</label>
    <input type="range" id="dm2" min="0.5" max="4" value="1.5" step="0.1">
    <span id="dm2v">1.5</span>
  </div>
  <div class="ctrl">
    <label>Mass 3</label>
    <input type="range" id="dm3" min="0.5" max="4" value="1.5" step="0.1">
    <span id="dm3v">1.5</span>
  </div>

  <div class="divider"></div>

  <div class="ctrl">
    <label>Speed</label>
    <input type="range" id="dspeed" min="1" max="30" value="16" step="1">
    <span id="dspeedv">16x</span>
  </div>
  <div class="ctrl">
    <label>Damping</label>
    <input type="range" id="ddamping" min="0" max="100" value="100" step="1">
    <span id="ddampingv">1.000</span>
  </div>

  <div class="divider"></div>

  <button id="dtrailBtn" onclick="toggleTrail()" class="active">Trail on</button>
  <button id="dsoundBtn" onclick="toggleSound()">Sound off</button>
  <button id="dstopBtn"  onclick="toggleStop()">Stop</button>
  <button onclick="resetSim()">Reset</button>
</div>

<!-- ── MOBILE: slim top bar ── -->
<div id="mobile-topbar">
  <button id="mtrailBtn" onclick="toggleTrail()" class="active">Trail</button>
  <button id="msoundBtn" onclick="toggleSound()">Sound</button>
  <button id="mstopBtn"  onclick="toggleStop()">Stop</button>
  <button onclick="resetSim()">Reset</button>
</div>

<canvas id="canvas"></canvas>

<div id="hint">drag a bob · release to swing</div>
<div id="drawerToggle" onclick="toggleDrawer()">&#9881;</div>

<!-- ── MOBILE: slide-up drawer ── -->
<div id="drawer">
  <div id="drawerHandle"></div>

  <div class="section-title">Arm lengths</div>
  <div class="slider-row">
    <div class="slider-label"><span class="dot" style="background:var(--bob1)"></span>Arm 1</div>
    <input type="range" id="ml1" min="40" max="180" value="110" step="1">
    <div class="slider-val" id="ml1v">110</div>
  </div>
  <div class="slider-row">
    <div class="slider-label"><span class="dot" style="background:var(--bob2)"></span>Arm 2</div>
    <input type="range" id="ml2" min="40" max="180" value="100" step="1">
    <div class="slider-val" id="ml2v">100</div>
  </div>
  <div class="slider-row">
    <div class="slider-label"><span class="dot" style="background:var(--bob3)"></span>Arm 3</div>
    <input type="range" id="ml3" min="40" max="180" value="90" step="1">
    <div class="slider-val" id="ml3v">90</div>
  </div>

  <div class="section-title">Bob mass</div>
  <div class="slider-row">
    <div class="slider-label"><span class="dot" style="background:var(--bob1)"></span>Mass 1</div>
    <input type="range" id="mm1" min="0.5" max="4" value="1.5" step="0.1">
    <div class="slider-val" id="mm1v">1.5</div>
  </div>
  <div class="slider-row">
    <div class="slider-label"><span class="dot" style="background:var(--bob2)"></span>Mass 2</div>
    <input type="range" id="mm2" min="0.5" max="4" value="1.5" step="0.1">
    <div class="slider-val" id="mm2v">1.5</div>
  </div>
  <div class="slider-row">
    <div class="slider-label"><span class="dot" style="background:var(--bob3)"></span>Mass 3</div>
    <input type="range" id="mm3" min="0.5" max="4" value="1.5" step="0.1">
    <div class="slider-val" id="mm3v">1.5</div>
  </div>

  <div class="section-title">Simulation</div>
  <div class="slider-row">
    <div class="slider-label">Speed</div>
    <input type="range" id="mspeed" min="1" max="30" value="16" step="1">
    <div class="slider-val" id="mspeedv">16x</div>
  </div>
  <div class="slider-row">
    <div class="slider-label">Damping</div>
    <input type="range" id="mdamping" min="0" max="100" value="100" step="1">
    <div class="slider-val" id="mdampingv">1.000</div>
  </div>
</div>

<script>
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');

  // Figure out which control bar is visible for height calculation
  function controlBarHeight() {
    const d = document.getElementById('desktop-controls');
    const m = document.getElementById('mobile-topbar');
    return (d.offsetParent !== null ? d : m).offsetHeight;
  }

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight - controlBarHeight();
  }
  window.addEventListener('resize', () => { resize(); resetSim(); });
  resize();

  // Physics config
  const G = 9.81, DT = 0.016;
  let DAMPING = 1.0;
  const BOB_RADIUS = 17;
  let STEPS_PER_FRAME = 16;

  // State
  let L1, L2, L3, M1, M2, M3;
  let a1, a2, a3, v1, v2, v3;
  let paused = false, showTrail = true;
  let trail = [];
  const MAX_TRAIL = 800;
  let dragging = null, pivotX, pivotY;
  let audioCtx = null, soundOn = false;

  // ── Read whichever slider set is active ──
  function isDesktop() { return window.innerWidth >= 700; }

  function readSliders() {
    const p = isDesktop() ? 'd' : 'm';
    L1 = +document.getElementById(p+'l1').value;
    L2 = +document.getElementById(p+'l2').value;
    L3 = +document.getElementById(p+'l3').value;
    M1 = +document.getElementById(p+'m1').value;
    M2 = +document.getElementById(p+'m2').value;
    M3 = +document.getElementById(p+'m3').value;
  }

  function resetSim() {
    readSliders();
    pivotX = canvas.width / 2;
    pivotY = canvas.height * 0.18;
    a1 = Math.PI/3; a2 = Math.PI/4; a3 = Math.PI/6;
    v1 = 0; v2 = 0; v3 = 0;
    trail = []; paused = false;
    ['dstopBtn','mstopBtn'].forEach(id => {
      const b = document.getElementById(id);
      if (b) { b.textContent = id.startsWith('d') ? 'Stop' : 'Stop'; b.classList.remove('active'); }
    });
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  resetSim();

  // ── RK4 Physics ──
  function derivatives(a1,v1,a2,v2,a3,v3) {
    const l1=L1,l2=L2,l3=L3,m1=M1,m2=M2,m3=M3;
    const d12=a1-a2,d13=a1-a3,d23=a2-a3;
    const s12=Math.sin(d12),c12=Math.cos(d12),s13=Math.sin(d13),c13=Math.cos(d13),s23=Math.sin(d23),c23=Math.cos(d23);
    const s1=Math.sin(a1),s2=Math.sin(a2),s3=Math.sin(a3);
    const Mt=m1+m2+m3,M23=m2+m3;
    const A11=Mt*l1*l1,A12=M23*l1*l2*c12,A13=m3*l1*l3*c13;
    const A22=M23*l2*l2,A23=m3*l2*l3*c23,A33=m3*l3*l3;
    const f1=-M23*l1*l2*v2*v2*s12-m3*l1*l3*v3*v3*s13-Mt*G*l1*s1;
    const f2= M23*l1*l2*v1*v1*s12-m3*l2*l3*v3*v3*s23-M23*G*l2*s2;
    const f3= m3*l1*l3*v1*v1*s13+m3*l2*l3*v2*v2*s23-m3*G*l3*s3;
    const det=A11*(A22*A33-A23*A23)-A12*(A12*A33-A23*A13)+A13*(A12*A23-A22*A13);
    return [v1,(f1*(A22*A33-A23*A23)-A12*(f2*A33-A23*f3)+A13*(f2*A23-A22*f3))/det,
               v2,(A11*(f2*A33-A23*f3)-f1*(A12*A33-A23*A13)+A13*(A12*f3-f2*A13))/det,
               v3,(A11*(A22*f3-f2*A23)-A12*(A12*f3-f2*A13)+f1*(A12*A23-A22*A13))/det];
  }

  function rk4Step() {
    const h=DT;
    const k1=derivatives(a1,v1,a2,v2,a3,v3);
    const k2=derivatives(a1+h/2*k1[0],v1+h/2*k1[1],a2+h/2*k1[2],v2+h/2*k1[3],a3+h/2*k1[4],v3+h/2*k1[5]);
    const k3=derivatives(a1+h/2*k2[0],v1+h/2*k2[1],a2+h/2*k2[2],v2+h/2*k2[3],a3+h/2*k2[4],v3+h/2*k2[5]);
    const k4=derivatives(a1+h*k3[0],v1+h*k3[1],a2+h*k3[2],v2+h*k3[3],a3+h*k3[4],v3+h*k3[5]);
    a1+=h/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]); v1+=h/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    a2+=h/6*(k1[2]+2*k2[2]+2*k3[2]+k4[2]); v2+=h/6*(k1[3]+2*k2[3]+2*k3[3]+k4[3]);
    a3+=h/6*(k1[4]+2*k2[4]+2*k3[4]+k4[4]); v3+=h/6*(k1[5]+2*k2[5]+2*k3[5]+k4[5]);
    v1*=DAMPING; v2*=DAMPING; v3*=DAMPING;
  }

  function getBobPositions() {
    const x1=pivotX+L1*Math.sin(a1),y1=pivotY+L1*Math.cos(a1);
    const x2=x1+L2*Math.sin(a2),y2=y1+L2*Math.cos(a2);
    const x3=x2+L3*Math.sin(a3),y3=y2+L3*Math.cos(a3);
    return {x1,y1,x2,y2,x3,y3};
  }

  // ── Draw a steel cylinder between two points ──
  // Uses three layered strokes: dark edge, mid steel, bright highlight
  function drawCylinder(x0, y0, x1, y1, radius) {
    const angle = Math.atan2(y1-y0, x1-x0);
    const nx = Math.cos(angle + Math.PI/2); // normal direction
    const ny = Math.sin(angle + Math.PI/2);

    // Dark edge (shadow side)
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
    ctx.strokeStyle = 'rgba(30,30,40,0.9)';
    ctx.lineWidth = radius * 2;
    ctx.lineCap = 'round'; ctx.stroke();

    // Mid steel tone
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
    ctx.strokeStyle = 'rgba(140,150,165,0.85)';
    ctx.lineWidth = radius * 1.5;
    ctx.stroke();

    // Bright highlight streak — offset toward the light source
    const hx0 = x0 - nx*radius*0.3, hy0 = y0 - ny*radius*0.3;
    const hx1 = x1 - nx*radius*0.3, hy1 = y1 - ny*radius*0.3;
    ctx.beginPath(); ctx.moveTo(hx0,hy0); ctx.lineTo(hx1,hy1);
    ctx.strokeStyle = 'rgba(230,240,255,0.55)';
    ctx.lineWidth = radius * 0.35;
    ctx.stroke();

    ctx.lineCap = 'butt';
  }

  // ── Draw a 3D steel sphere with color tint ──
  function drawSteelBob(x, y, r, color, darkColor) {
    // Outer shadow/ambient occlusion
    const shadow = ctx.createRadialGradient(x+r*0.1, y+r*0.15, r*0.5, x, y, r*1.3);
    shadow.addColorStop(0, 'transparent');
    shadow.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.beginPath(); ctx.arc(x, y, r*1.3, 0, Math.PI*2);
    ctx.fillStyle = shadow; ctx.fill();

    // Main sphere — dark base blending to the color
    const sphere = ctx.createRadialGradient(x-r*0.3, y-r*0.35, r*0.05, x+r*0.1, y+r*0.1, r*1.1);
    sphere.addColorStop(0.0, lighten(color, 0.55));   // lit top-left
    sphere.addColorStop(0.35, color);                  // mid — full color
    sphere.addColorStop(0.75, darkColor);              // shadow side
    sphere.addColorStop(1.0,  'rgba(10,10,15,0.95)'); // deep shadow edge
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = sphere; ctx.fill();

    // Steel sheen — grey overlay that catches the light
    const sheen = ctx.createRadialGradient(x-r*0.25, y-r*0.3, 0, x-r*0.1, y-r*0.1, r*0.85);
    sheen.addColorStop(0,   'rgba(220,230,255,0.38)');
    sheen.addColorStop(0.5, 'rgba(180,195,220,0.08)');
    sheen.addColorStop(1,   'transparent');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = sheen; ctx.fill();

    // Sharp specular highlight
    const spec = ctx.createRadialGradient(x-r*0.38, y-r*0.42, 0, x-r*0.3, y-r*0.3, r*0.38);
    spec.addColorStop(0,   'rgba(255,255,255,0.95)');
    spec.addColorStop(0.4, 'rgba(255,255,255,0.3)');
    spec.addColorStop(1,   'transparent');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = spec; ctx.fill();
  }

  // Lighten a hex color by mixing toward white
  function lighten(hex, t) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const lr=Math.round(r+(255-r)*t), lg=Math.round(g+(255-g)*t), lb=Math.round(b+(255-b)*t);
    return `rgb(${lr},${lg},${lb})`;
  }

  // Helper: parse a CSS hex color to r,g,b integers
  function hexToRgb(hex) {
    const h = hex.replace('#','');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const {x1,y1,x2,y2,x3,y3}=getBobPositions();

    // Read bob colors from CSS variables once per frame
    const cs   = getComputedStyle(document.documentElement);
    const col1 = cs.getPropertyValue('--bob1').trim();
    const col2 = cs.getPropertyValue('--bob2').trim();
    const col3 = cs.getPropertyValue('--bob3').trim();
    const [r3,g3,b3] = hexToRgb(col3);

    // Trail — matches bob 3 color
    if (showTrail && trail.length>1) {
      for (let i=1;i<trail.length;i++) {
        const alpha=(i/trail.length)*0.6;
        ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y);
        ctx.strokeStyle=`rgba(${r3},${g3},${b3},${alpha})`; ctx.lineWidth=1.5; ctx.stroke();
      }
    }

    // Steel cylinders (arms) — drawn before bobs so bobs sit on top
    const cylR = 3.5;
    drawCylinder(pivotX, pivotY, x1, y1, cylR);
    drawCylinder(x1, y1, x2, y2, cylR);
    drawCylinder(x2, y2, x3, y3, cylR);

    // Pivot bolt
    const pivGrad = ctx.createRadialGradient(pivotX-2, pivotY-2, 1, pivotX, pivotY, 7);
    pivGrad.addColorStop(0, '#e0e8ff');
    pivGrad.addColorStop(0.4, '#888fa0');
    pivGrad.addColorStop(1, '#222');
    ctx.beginPath(); ctx.arc(pivotX, pivotY, 7, 0, Math.PI*2);
    ctx.fillStyle = pivGrad; ctx.fill();

    // Steel bobs with color tint
    const bobs=[
      {x:x1,y:y1, color:col1, dark:'#4a0a7a'},
      {x:x2,y:y2, color:col2, dark:'#7a5a00'},
      {x:x3,y:y3, color:col3, dark:'#006a5a'},
    ];
    bobs.forEach(b => drawSteelBob(b.x, b.y, BOB_RADIUS, b.color, b.dark));

    // Drag ring indicator
    if (paused||dragging!==null) {
      bobs.forEach(b=>{
        ctx.beginPath(); ctx.arc(b.x,b.y,BOB_RADIUS+7,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1.5;
        ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
      });
    }
  }

  function loop() {
    if (!paused&&dragging===null) {
      for (let i=0;i<STEPS_PER_FRAME;i++) rk4Step();
      if (showTrail) {
        const {x3,y3}=getBobPositions(); trail.push({x:x3,y:y3});
        if (trail.length>MAX_TRAIL) trail.shift();
      }
    }
    updateSound(); draw();
    requestAnimationFrame(loop);
  }
  loop();

  // ── Drag ──
  function canvasPos(e) {
    const rect=canvas.getBoundingClientRect(), src=e.touches?e.touches[0]:e;
    return {x:src.clientX-rect.left, y:src.clientY-rect.top};
  }
  function hitBob(pos) {
    const {x1,y1,x2,y2,x3,y3}=getBobPositions();
    const bobs=[{x:x1,y:y1},{x:x2,y:y2},{x:x3,y:y3}];
    for (let i=0;i<bobs.length;i++) {
      const dx=pos.x-bobs[i].x,dy=pos.y-bobs[i].y;
      if (Math.sqrt(dx*dx+dy*dy)<BOB_RADIUS*3) return i+1;
    }
    return null;
  }
  function onStart(e) {
    if (e.target.closest('#drawer')||e.target.closest('#drawerToggle')) return;
    e.preventDefault();
    const pos=canvasPos(e),hit=hitBob(pos);
    if (hit) { dragging=hit; paused=true; v1=0;v2=0;v3=0; trail=[]; document.getElementById('hint').classList.add('hidden'); }
  }
  function onMove(e) {
    if (dragging===null) return; e.preventDefault();
    const pos=canvasPos(e);
    if (dragging===3) { const d=Math.atan2(pos.x-pivotX,pos.y-pivotY)-a1; a1+=d;a2+=d;a3+=d; }
    else if (dragging===2) { const d=Math.atan2(pos.x-pivotX,pos.y-pivotY)-a1; a1+=d;a2+=d;a3=0; }
    else { a1=Math.atan2(pos.x-pivotX,pos.y-pivotY); a2=0;a3=0; }
  }
  function onEnd() { if (dragging!==null) { dragging=null; paused=false; } }

  canvas.addEventListener('mousedown',  onStart, {passive:false});
  canvas.addEventListener('mousemove',  onMove,  {passive:false});
  canvas.addEventListener('mouseup',    onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas.addEventListener('touchstart', onStart, {passive:false});
  canvas.addEventListener('touchmove',  onMove,  {passive:false});
  canvas.addEventListener('touchend',   onEnd,   {passive:false});

  // ── Mobile drawer ──
  let drawerOpen=false;
  function toggleDrawer() {
    drawerOpen=!drawerOpen;
    document.getElementById('drawer').classList.toggle('open',drawerOpen);
    document.getElementById('drawerToggle').innerHTML=drawerOpen?'&#10005;':'&#9881;';
    document.getElementById('hint').classList.toggle('hidden',drawerOpen);
  }
  canvas.addEventListener('touchstart',e=>{
    if (drawerOpen&&!hitBob(canvasPos(e))) toggleDrawer();
  },{passive:true});

  // ── Slider binding — syncs both desktop (d) and mobile (m) sliders ──
  function bindBothSliders(name, onchange, fmt) {
    ['d'+name, 'm'+name].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.oninput = function() {
        const val = +this.value;
        // Keep the other slider in sync
        const otherId = id.startsWith('d') ? 'm'+name : 'd'+name;
        const other = document.getElementById(otherId);
        if (other) other.value = val;
        // Update both display spans
        ['d'+name+'v', 'm'+name+'v'].forEach(vid => {
          const span = document.getElementById(vid);
          if (span) span.textContent = fmt ? fmt(val) : val;
        });
        onchange(val);
      };
    });
  }

  bindBothSliders('l1', v=>{L1=v;trail=[];});
  bindBothSliders('l2', v=>{L2=v;trail=[];});
  bindBothSliders('l3', v=>{L3=v;trail=[];});
  bindBothSliders('m1', v=>{M1=v;});
  bindBothSliders('m2', v=>{M2=v;});
  bindBothSliders('m3', v=>{M3=v;});
  bindBothSliders('speed',   v=>{STEPS_PER_FRAME=v;}, v=>v+'x');
  bindBothSliders('damping', v=>{
    DAMPING=0.9990+v/100*0.0010;
    ['ddampingv','mdampingv'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=DAMPING.toFixed(4); });
  });

  // ── Buttons — update both desktop and mobile versions ──
  function setAllButtons(dId, mId, text, active) {
    [dId, mId].forEach(id => {
      const b = document.getElementById(id);
      if (!b) return;
      b.textContent = text;
      active ? b.classList.add('active') : b.classList.remove('active');
    });
  }

  function toggleTrail() {
    showTrail=!showTrail; trail=[];
    setAllButtons('dtrailBtn','mtrailBtn', showTrail?'Trail on':'Trail off', showTrail);
  }
  function toggleStop() {
    paused=!paused;
    setAllButtons('dstopBtn','mstopBtn', paused?'Resume':'Stop', paused);
  }
  function toggleSound() {
    buildAudio();
    if (audioCtx.state==='suspended') audioCtx.resume();
    soundOn=!soundOn;
    setAllButtons('dsoundBtn','msoundBtn', soundOn?'Sound on':'Sound off', soundOn);
    if (!soundOn) { const now=audioCtx.currentTime; bobAudio.forEach(b=>b.gain&&b.gain.gain.setTargetAtTime(0,now,0.05)); }
  }

  // ── Sound engine ──
  const bobAudio = [
    { baseFreq: 261.6 },   // Bob 1 — C4  (red)
    { baseFreq: 329.6 },   // Bob 2 — E4  (yellow)
    { baseFreq: 392.0 },   // Bob 3 — G4  (green)
  ];
  function buildAudio() {
    if (audioCtx) return;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const master=audioCtx.createGain(); master.gain.setValueAtTime(0.9,audioCtx.currentTime); master.connect(audioCtx.destination);
    const revLen=audioCtx.sampleRate*2.5, revBuf=audioCtx.createBuffer(2,revLen,audioCtx.sampleRate);
    for (let ch=0;ch<2;ch++){const d=revBuf.getChannelData(ch);for(let i=0;i<revLen;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/revLen,2.5);}
    const reverb=audioCtx.createConvolver(); reverb.buffer=revBuf;
    const dry=audioCtx.createGain(),wet=audioCtx.createGain();
    dry.gain.setValueAtTime(0.55,audioCtx.currentTime); wet.gain.setValueAtTime(0.45,audioCtx.currentTime);
    dry.connect(master); reverb.connect(wet); wet.connect(master);
    bobAudio.forEach(b=>{
      const osc=audioCtx.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(b.baseFreq, audioCtx.currentTime); osc.start();
      const gain=audioCtx.createGain(); gain.gain.setValueAtTime(0,audioCtx.currentTime);
      osc.connect(gain); gain.connect(dry); gain.connect(reverb);
      b.osc=osc; b.gain=gain;
    });
  }
  function updateSound() {
    if (!soundOn||!audioCtx) return;
    const now=audioCtx.currentTime, vels=[Math.abs(v1),Math.abs(v2),Math.abs(v3)];
    bobAudio.forEach((b,i)=>{
      const spd=Math.min(vels[i],15);
      // Pitch rises up to one octave above base as speed increases
      b.osc.frequency.setTargetAtTime(b.baseFreq*(1+spd/15),now,0.05);
      // Volume swells with speed
      b.gain.gain.setTargetAtTime(Math.min(spd/8,1)*1.0,now,0.08);
    });
  }
</script>
</body>
</html>
